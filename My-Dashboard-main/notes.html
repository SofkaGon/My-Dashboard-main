<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet" >
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=keyboard_double_arrow_right,keyboard_double_arrow_left" />
        <script src="script.js" defer></script>
        <title>Notes App</title>
        <style>
             * { margin: 0; padding: 0; box-sizing: border-box; }
            body { font-family: Arial, sans-serif; display: flex; height: 100vh; overflow: hidden; background-color: #f4f4f4; color: #1e254f;}
            aside { width: 300px; background-color: #f4f4f4; border-right: 1px solid #ccc; flex-direction: column; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
            header { font-size: 1.5em; padding: 20px; border-bottom: 1px solid #ccc; }
            #search-notes { padding: 10px; width: 100%; font-size: 1rem; border: none; border-bottom: 1px solid #ccc; background-color: #b1bdff; color: #1e254f; }
            #note-list { flex: 1; overflow-y: auto; }
            .note-item { padding: 15px; border-bottom: 1px solid #ccc; cursor: pointer; position: relative; }
            .note-item.active { background-color: #d1aff9; }
            .note-item small { color: #8d66bb; }
            .note-item h4 { margin-bottom: 5px; font-size: 1rem; font-weight: bold; }
            .pinned { position: absolute; top: 15px; right:10px;font-size: 16px; color: #ffcc00; }
            main { flex: 1; display: flex; flex-direction: column; padding: 20px; }
            .note-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
            .note-header input { flex: 1; padding: 10px; font-size: 1.2rem; border: none; color: #1e254f; background-color: transparent; border-bottom: 1px solid #ccc; width: 100%; }
            .note-body { flex: 1; margin-top: 20px; }
            .note-body textarea { width: 100%; height: 100%; padding: 10px; font-size: 1rem; border: none; resize: none; color: #1e254f; background-color: transparent; resize: none; }
            .controls { display: flex; justify-content: space-between; padding-top: 10px; }
            button { padding: 10px 20px; border: none; background-color: #b1bdff; color: #242d69; cursor: pointer; border-radius: 5px; transition: background-color 0.3s; }
            button:hover { background-color: #5e67a0; color: #ffffff; }
            .pinButton { background-color: #ffcc00; color: #1e254f; }
            .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; }
            .modal.active { display: flex; }
            .modal-content { background-color: #fff; padding: 20px; border-radius: 5px; text-align: center; }
            .moodal-content h2 { margin-bottom: 20px; font-size: 1.2rem; }
            .model-content p { margin-bottom: 20px; color: #333; }
            .modal-actions { display: flex; justify-content: space-between; gap: 10px; }
            .modal-actions button { flex: 1; }
            .button-cancel { background-color: #ccc; color: #1e254f; }
            .button-cancel:hover { background-color: #999; }
            .button-delete { background-color: #e45b5b; color: #fff; }
            .button-delete:hover { background-color: #b45151; }
            /* Responsive/ mobile/tablet device Design */
            @media only screen and (max-width: 600px) {
                aside { width: 45vw; margin: 10px; min-width: 100px;  }   
                body {margin: 10px;}
                header { font-size: 25px; padding: 30px }
                *{ font-size: 20px; }
                

            }
            .wrap { display: flex; height: 100%; width: 100%; }
            .toggle-panel { display: none; width: 50px; height: 70px; flex-shrink: 0; display:grid; place-items: center; margin: 10px; margin-left: 0px; margin-top: 0px; background-color: #b1bdff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); border: none; padding: 20px; cursor: pointer; border-radius: 0px 5px 5px 0px; }
            .icon-close { display: none !important; }
            .side-panel { display:none;}
            .side-panel-open.side-panel-open { display: initial; }
            .icon-open { display: none !important;  }
            .icon-close { display: inline !important; }
            .side-panel-open + .toggle-panel .icon-open { display: none !important;  }
            .side-panel-open + .toggle-panel .icon-close { display: inline !important; }
                    
        </style>
    </head>
    <body>


        <!--pop out side panel for mobile/tablet-->


        <!-- Notes App Layout -->

        <div class="wrap">
            
        <aside class="side-panel side-panel-open">
            <header style="color: #5e67a0; font-weight: bold;"> My Dream Notes</header>
            <input id="search-notes"  placeholder= " Search for your note here..." oninput="renderNotes()">
        <div id="note-list"></div>
        <button style="width: 100%;" onclick="createNote() ">Create Note</button>
        </aside>
        <button class="toggle-panel" type="button">
                <span class="material-symbols-outlined icon-open" >keyboard_double_arrow_left</span>
                <span class="material-symbols-outlined icon-close">keyboard_double_arrow_right</span>

            </button>
        <main>
            <div class="note-header">
                <input id="note-title" type="text" placeholder="Note Title" oninput="updateCurrentNote()">
                <button id="pin-note" onclick="togglePin()">Pin</button>
            </div>
            <div class="note-body">
                <textarea id="note-content" placeholder="Write your note here to start your perfect day..." oninput="updateCurrentNote()"></textarea>
            </div>
            <div class="controls">
                <span id="note-date">Last edited: -</span>
                <button onclick="showModal()">Delete Note</button>
            </div>
        </main>
        <div class="modal" id="delete-modal">
            <div class="modal-content">
                <p style="padding: 10px;">Are you sure you want to delete this note?</p>
                <div class="modal-actions">
                    <button class="button-cancel" onclick="hideModal()">Cancel</button>
                    <button class="button-delete" onclick="deleteNote()">Delete</button>
                </div>
            </div>
        </div>
        </div>

        <script>

            document.querySelector('.toggle-panel').addEventListener('click', function() {
                document.querySelector('.side-panel').classList.toggle('side-panel-open');
            });

            let notes = JSON.parse(localStorage.getItem('notes')) || [];
            let currentNoteIndex = null;

            const listContainer = document.getElementById('note-list');
            const titleInput = document.getElementById('note-title');
            const contentInput = document.getElementById('note-content');
            const noteDate = document.getElementById('note-date');
            const searchInput = document.getElementById('search-notes');
            const pinButton = document.getElementById('pin-note');
            const deleteModal = document.getElementById('delete-modal');

            function saveNotes() {
                localStorage.setItem('notes', JSON.stringify(notes));
            }

            function renderNotes() {
                const query = searchInput.value.toLowerCase();
                listContainer.innerHTML = '';

                const pinned = notes.filter(note => note.pinned);
                const others = notes.filter(note => !note.pinned);

                const filtered = [...pinned, ...others].filter(note => {
                const title = (note.title || '').toLowerCase();
                const content = (note.content || '').toLowerCase();

                return title.includes(query) || content.includes(query);
            });

            for (const note of filtered) {
                const noteElement = document.createElement('div');

            noteElement.className =
                'note-item' + (note.id === currentNoteIndex ? ' active' : '');

            noteElement.onclick = () => selectNote(note.id);

            noteElement.innerHTML =
                '<h4>' + (note.title || 'Untitled Note') + '</h4>' +
                '<small>' + note.date + '</small>' +
                (note.pinned ? '<span class="pinned">📌</span>' : '');

            listContainer.appendChild(noteElement);
            }
        }
                
            

            function selectNote(id) {
                currentNoteIndex = id;
                const note = notes.find(n => n.id === id);
                if (!note) return;

                titleInput.value = note.title;
                contentInput.value = note.content;
                noteDate.textContent = 'Last edited: ' + note.date;
                pinButton.textContent = note.pinned ? 'Unpin' : 'Pin';
                renderNotes();
            }

            function updateCurrentNote() {
                const note = notes.find(n => n.id === currentNoteIndex);
                if (!note) return;

                note.title = titleInput.value;
                note.content = contentInput.value;
                note.date = new Date().toLocaleString();
                noteDate.textContent = 'Last edited: ' + note.date;
                saveNotes();
                renderNotes();
            }

            function createNote() {
                const newNote = {
                    id: Date.now(),
                    title: '',
                    content: '',
                    date: new Date().toLocaleString(),
                    pinned: false
                };

                notes.unshift(newNote);
                currentNoteIndex = newNote.id;
                saveNotes();
                renderNotes();
                selectNote(newNote.id);
            }

            function showModal() {
                if (currentNoteIndex === null) return;
                deleteModal.classList.add('active');
            }

            function hideModal() {
                deleteModal.classList.remove('active');
            }

            function deleteNote() {
                if (currentNoteIndex === null) return;

                notes = notes.filter(n => n.id !== currentNoteIndex);
                currentNoteIndex = null;
                titleInput.value = '';
                contentInput.value = '';
                noteDate.textContent = 'Last edited: -';
                hideModal();
                saveNotes();
                renderNotes();
            }

            function togglePin() {
                const note = notes.find(n => n.id === currentNoteIndex);
                if (!note) return;

                note.pinned = !note.pinned;
                pinButton.textContent = note.pinned ? 'Unpin' : 'Pin';
                saveNotes();
                renderNotes();
            }

            renderNotes();
        </script>
    </body>
</html>
